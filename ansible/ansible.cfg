# ansible.cfg
#
# Ansible reads this file when you run ansible from this folder (ansible/).
# It tells Ansible where the inventory and the roles are, so you do not
# have to type them on every command.

[defaults]
# The list of VMs for the single-control-plane layout.
inventory = inventories/single-control-plane/hosts.ini

# Where to find roles such as "prereq" and "kubeadm".
roles_path = roles

# The lab VMs are rebuilt often and get new SSH host keys each time.
# Turning this off stops "host key changed" errors. Only do this for lab VMs.
host_key_checking = False

# Use the Python that the VMs already have, without printing a warning.
interpreter_python = auto_silent

# Show task results in a readable format.
callback_result_format = yaml

# kubernetes.core 6.6 emits status.values deprecation notices even when the
# caller never reads that field. Hide deprecation notices for this lab;
# ordinary warnings and errors remain enabled.
deprecation_warnings = False

[ssh_connection]
# Run tasks over one SSH connection where possible. Faster.
pipelining = True
