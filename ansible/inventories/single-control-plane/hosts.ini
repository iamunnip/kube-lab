# Inventory for the single-control-plane layout.
#
# An inventory is the list of machines Ansible manages, sorted into groups.
# The IPs and names match vagrant/single-control-plane/Vagrantfile.
#
#   ansible_host     the VM's private IP, Ansible connects to it over SSH
#   vagrant_machine  the VM's name in the Vagrantfile. lab.yml uses it to find
#                    the SSH key Vagrant made for this VM. It must be a host
#                    setting: when a task on node-1 runs a step on the control
#                    plane (delegate_to), Ansible then picks the control
#                    plane's key, not node-1's.

# The VM that runs the Kubernetes control plane.
[control_plane]
control-plane ansible_host=192.168.56.10 vagrant_machine=control-plane

# The VMs that run your apps.
[nodes]
node-1 ansible_host=192.168.56.11 vagrant_machine=node-1
node-2 ansible_host=192.168.56.12 vagrant_machine=node-2

# "cluster" is every VM: the control plane and the nodes together.
[cluster:children]
control_plane
nodes
