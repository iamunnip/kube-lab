# Adds every node's name and private IP to /etc/hosts, so nodes can find
# each other by name (for example "ping node-1") without a DNS server.

- name: Add all cluster nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} kube-lab nodes (managed by Ansible, k8s_prepare role)"
    block: |
      {% for host in groups['cluster'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
